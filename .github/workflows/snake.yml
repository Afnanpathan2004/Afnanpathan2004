name: Generate Autumn Contribution Snake

on:
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Autumn Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Afnanpathan2004
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#D0A823&color_dots=#FBFBF5,#FEED9F,#F8CB78,#EBAA32,#A83A0A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F7D327&color_dots=#231D16,#54280D,#9A7807,#D0A823,#EB7134
            dist/github-snake-autumn.svg?palette=github-dark&color_snake=#F7D327&color_dots=#18130E,#54280D,#9A7807,#D0A823,#EB7134

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate autumn contribution snake [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
