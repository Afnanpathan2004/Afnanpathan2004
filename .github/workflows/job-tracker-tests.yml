name: Job Tracker - Tests

on:
  push:
    paths:
      - "job-hunt-tracker/pipeline/**"
      - "job-hunt-tracker/build/**"
      - ".github/workflows/job-tracker-*.yml"
  pull_request:
    paths:
      - "job-hunt-tracker/pipeline/**"
      - "job-hunt-tracker/build/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: job-hunt-tracker/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-hunt-tracker/pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Offline pipeline tests (saved API responses, no network)
        run: python -m unittest discover -s tests -v
