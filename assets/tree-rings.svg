<svg width="100%" height="auto" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEED9F"/>
      <stop offset="35%" stop-color="#F7D327"/>
      <stop offset="70%" stop-color="#D0A823"/>
      <stop offset="100%" stop-color="#EB7134"/>
    </linearGradient>

    <radialGradient id="ringCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7D327" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#18130E" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="ringsCardClip">
      <rect x="0" y="0" width="860" height="220" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ringsCardClip)">
    <!-- Background -->
    <rect width="860" height="220" fill="#18130E"/>
    <rect x="0" y="0" width="860" height="220" fill="none" stroke="#504C41" stroke-width="1"/>
    <rect x="3" y="3" width="854" height="214" rx="12" fill="none" stroke="#D0A823" stroke-width="0.5" stroke-opacity="0.3"/>

    <!-- Organic Tree Rings (Left Center) -->
    <g transform="translate(140, 110)">
      <!-- Radial Glow behind Heartwood -->
      <circle cx="0" cy="0" r="90" fill="url(#ringCenterGlow)"/>

      <!-- Ring 1 (Heartwood / Core CS) -->
      <ellipse cx="0" cy="0" rx="14" ry="12" fill="#2D1C13" stroke="#F7D327" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="4" fill="#F7D327"/>

      <!-- Ring 2 (Systems & Linux) -->
      <path d="M-28,2 C-26,-18 2,-28 26,-20 C42,-12 40,16 22,28 C4,36 -24,24 -28,2 Z"
            fill="none" stroke="#D0A823" stroke-width="1.4" opacity="0.85"/>

      <!-- Ring 3 (Cloud & Terraform) -->
      <path d="M-46,4 C-44,-32 4,-46 44,-34 C72,-20 68,26 38,44 C6,58 -38,40 -46,4 Z"
            fill="none" stroke="#EBAA32" stroke-width="1.4" opacity="0.8"/>

      <!-- Ring 4 (SRE & Observability) -->
      <path d="M-66,8 C-62,-46 8,-66 62,-48 C100,-28 94,36 54,62 C8,82 -54,58 -66,8 Z"
            fill="none" stroke="#EB7134" stroke-width="1.4" opacity="0.75"/>

      <!-- Ring 5 (Platform Engineering & AI) -->
      <path d="M-86,10 C-82,-62 10,-86 82,-62 C130,-36 122,48 70,82 C10,108 -70,76 -86,10 Z"
            fill="none" stroke="#A83A0A" stroke-width="1.4" opacity="0.7"/>

      <!-- Connecting Radial Ray pointing to Growth Rings -->
      <line x1="12" y1="-2" x2="180" y2="-45" stroke="#D0A823" stroke-dasharray="2,3" stroke-width="1" opacity="0.6"/>
      <line x1="38" y1="44" x2="180" y2="40" stroke="#EB7134" stroke-dasharray="2,3" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Content Title -->
    <text x="320" y="38"
          font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace"
          font-size="12" font-weight="700" fill="#FEED9F" letter-spacing="1.8">
      &#127794; SEASONS OF GROWTH // ENGINEERING CHRONOLOGY
    </text>

    <!-- Growth Rings Timeline (Right Side) -->
    <g transform="translate(320, 68)" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12">
      <!-- Layer 1 -->
      <g>
        <circle cx="6" cy="0" r="4.5" fill="#F7D327"/>
        <text x="24" y="4" font-weight="600" fill="#F7D327">HEARTWOOD:</text>
        <text x="120" y="4" fill="#FBFBF5">Linux internals, OS fundamentals, Python &amp; Bash systems</text>
      </g>

      <!-- Layer 2 -->
      <g transform="translate(0, 32)">
        <circle cx="6" cy="0" r="4.5" fill="#D0A823"/>
        <text x="24" y="4" font-weight="600" fill="#D0A823">INFRA LAYER:</text>
        <text x="120" y="4" fill="#FBFBF5">AWS cloud architecture, Terraform IaC, container platforms</text>
      </g>

      <!-- Layer 3 -->
      <g transform="translate(0, 64)">
        <circle cx="6" cy="0" r="4.5" fill="#EB7134"/>
        <text x="24" y="4" font-weight="600" fill="#EB7134">RELIABILITY:</text>
        <text x="120" y="4" fill="#FBFBF5">Prometheus metrics, Grafana dashboards, automated SRE recovery</text>
      </g>

      <!-- Layer 4 -->
      <g transform="translate(0, 96)">
        <circle cx="6" cy="0" r="4.5" fill="#A83A0A"/>
        <text x="24" y="4" font-weight="600" fill="#A83A0A">CANOPY:</text>
        <text x="120" y="4" fill="#FBFBF5">Distributed systems, platform tooling, and backend architectures</text>
      </g>
    </g>

    <!-- Bottom Caption -->
    <text x="320" y="196"
          font-family="Georgia, Cambria, 'Times New Roman', serif" font-style="italic"
          font-size="11.5" fill="#9B704B">
      Like enduring trees, resilient software builds strength ring by ring, season after season.
    </text>
  </g>
</svg>
