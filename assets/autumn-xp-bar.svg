<svg width="100%" height="auto" viewBox="0 0 1200 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="autumnBarFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7807"/>
      <stop offset="35%" stop-color="#D0A823"/>
      <stop offset="70%" stop-color="#F7D327"/>
      <stop offset="90%" stop-color="#EBAA32"/>
      <stop offset="100%" stop-color="#EB7134"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="xpClip">
      <rect x="24" y="24" width="1152" height="14" rx="7"/>
    </clipPath>
  </defs>

  <!-- Track Base -->
  <rect x="20" y="20" width="1160" height="22" rx="11"
        fill="#18130E" stroke="#504C41" stroke-width="1.2"/>

  <!-- Filled Bar with Clip -->
  <g clip-path="url(#xpClip)">
    <rect x="24" y="24" width="1152" height="14" fill="url(#autumnBarFill)">
      <animate attributeName="width" values="0;1152;1152" keyTimes="0;0.5;1" dur="2.8s" fill="freeze"/>
    </rect>

    <!-- Traveling Shimmer Pulse -->
    <rect x="0" y="24" width="120" height="14" fill="url(#shimmer)">
      <animate attributeName="x" values="-120;1200" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Small Leaf Accents at endpoints -->
  <path d="M14,31 C11,26 13,22 17,24 C16,28 17,31 14,31 Z" fill="#D0A823"/>
  <path d="M1186,31 C1189,26 1187,22 1183,24 C1184,28 1183,31 1186,31 Z" fill="#EB7134"/>

  <!-- Telemetry Subtext -->
  <text x="600" y="56" text-anchor="middle"
        font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace"
        font-size="11.5" font-weight="600" fill="#FEED9F" letter-spacing="2.8">
    INFRASTRUCTURE CAPACITY: 99.9% &#10022; ACTIVE PIPELINES &#10022; BUILDING RESILIENT SYSTEMS
  </text>
</svg>
