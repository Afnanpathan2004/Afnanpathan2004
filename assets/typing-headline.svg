<svg width="100%" height="auto" viewBox="0 0 800 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- High-Contrast Autumn Text Gradient for Light Backgrounds -->
    <linearGradient id="lightTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54280D"/>
      <stop offset="35%" stop-color="#A83A0A"/>
      <stop offset="70%" stop-color="#D0A823"/>
      <stop offset="100%" stop-color="#40271D"/>
    </linearGradient>
  </defs>

  <g transform="translate(400, 42)">
    <!-- Domain 1: Cloud & Infrastructure -->
    <text text-anchor="middle"
          font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace"
          font-size="22" font-weight="700" letter-spacing="1.5"
          fill="url(#lightTextGrad)" opacity="0">
      &#10022; Cloud Infrastructure &amp; Systems Engineering &#10022;
      <animate attributeName="opacity"
        values="0; 1; 1; 0; 0; 0; 0; 0"
        keyTimes="0; 0.05; 0.22; 0.25; 0.26; 0.5; 0.75; 1"
        dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- Domain 2: Site Reliability & Observability -->
    <text text-anchor="middle"
          font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace"
          font-size="22" font-weight="700" letter-spacing="1.5"
          fill="url(#lightTextGrad)" opacity="0">
      &#10022; Site Reliability Engineering &amp; Observability &#10022;
      <animate attributeName="opacity"
        values="0; 0; 1; 1; 0; 0; 0; 0"
        keyTimes="0; 0.25; 0.30; 0.47; 0.50; 0.51; 0.75; 1"
        dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- Domain 3: DevOps & Automation -->
    <text text-anchor="middle"
          font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace"
          font-size="22" font-weight="700" letter-spacing="1.5"
          fill="url(#lightTextGrad)" opacity="0">
      &#10022; DevOps, CI/CD &amp; Systems Automation &#10022;
      <animate attributeName="opacity"
        values="0; 0; 0; 1; 1; 0; 0; 0"
        keyTimes="0; 0.50; 0.55; 0.72; 0.75; 0.76; 0.88; 1"
        dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- Domain 4: AI & Distributed Systems -->
    <text text-anchor="middle"
          font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace"
          font-size="22" font-weight="700" letter-spacing="1.5"
          fill="url(#lightTextGrad)" opacity="0">
      &#10022; Artificial Intelligence &amp; Distributed Systems &#10022;
      <animate attributeName="opacity"
        values="0; 0; 0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.75; 0.80; 0.96; 0.99; 1; 1; 1"
        dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
