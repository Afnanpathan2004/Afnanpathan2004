<svg width="100%" height="auto" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light Golden Sunlight Gradients -->
    <linearGradient id="lightSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBFBF5"/>
      <stop offset="35%" stop-color="#FFFDF5"/>
      <stop offset="65%" stop-color="#FFF6D8"/>
      <stop offset="85%" stop-color="#FEED9F"/>
      <stop offset="100%" stop-color="#F8CB78"/>
    </linearGradient>

    <!-- Radiant Sun Bloom (Filtering through Trees) -->
    <radialGradient id="lightSunGlow" cx="50%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#FFF6D8" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#FEED9F" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#F7D327" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#F8CB78" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FBFBF5" stop-opacity="0"/>
    </radialGradient>

    <!-- High-Contrast Title Gradient (Warm Earth & Golden Amber for Light Theme) -->
    <linearGradient id="warmTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54280D"/>
      <stop offset="35%" stop-color="#40271D"/>
      <stop offset="70%" stop-color="#A83A0A"/>
      <stop offset="100%" stop-color="#D0A823"/>
    </linearGradient>

    <linearGradient id="goldenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D0A823"/>
      <stop offset="50%" stop-color="#EB7134"/>
      <stop offset="100%" stop-color="#D0A823"/>
    </linearGradient>

    <linearGradient id="lightGroundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8DDB9"/>
      <stop offset="100%" stop-color="#D0A823" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Reusable Leaf Shapes -->
    <g id="mapleLeaf">
      <path d="M0,-16 C3,-10 9,-8 12,-6 C9,-2 7,3 9,8 C5,6 1,7 0,14 C-1,7 -5,6 -9,8 C-7,3 -9,-2 -12,-6 C-9,-8 -3,-10 0,-16 Z"/>
    </g>
    <g id="beechLeaf">
      <path d="M0,-14 C7,-8 7,6 0,14 C-7,6 -7,-8 0,-14 Z"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="rgba(255,255,255,0.6)" stroke-width="0.8"/>
    </g>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="heroCardClip">
      <rect x="0" y="0" width="1200" height="400" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroCardClip)">
    <!-- Base Sky Canvas: Warm Sunlit Autumn Ivory -->
    <rect width="1200" height="400" fill="url(#lightSkyGrad)"/>

    <!-- Radiant Golden Sunlight Filtering Across Canopy -->
    <circle cx="600" cy="300" r="320" fill="url(#lightSunGlow)"/>

    <!-- Sun Ray Light Beams (Soft Golden Highlights) -->
    <g opacity="0.22" fill="none" stroke="#FEED9F" stroke-width="45">
      <line x1="600" y1="280" x2="150" y2="0"/>
      <line x1="600" y1="280" x2="380" y2="0"/>
      <line x1="600" y1="280" x2="600" y2="0"/>
      <line x1="600" y1="280" x2="820" y2="0"/>
      <line x1="600" y1="280" x2="1050" y2="0"/>
    </g>

    <!-- Subtle Architectural Horizon Grid -->
    <g opacity="0.18" stroke="#D0A823" stroke-width="0.75">
      <line x1="0" y1="290" x2="1200" y2="290"/>
      <line x1="0" y1="320" x2="1200" y2="320"/>
      <line x1="0" y1="345" x2="1200" y2="345"/>
      <line x1="0" y1="365" x2="1200" y2="365"/>
      <line x1="0" y1="380" x2="1200" y2="380"/>
      <line x1="600" y1="290" x2="0" y2="400"/>
      <line x1="600" y1="290" x2="250" y2="400"/>
      <line x1="600" y1="290" x2="450" y2="400"/>
      <line x1="600" y1="290" x2="750" y2="400"/>
      <line x1="600" y1="290" x2="950" y2="400"/>
      <line x1="600" y1="290" x2="1200" y2="400"/>
    </g>

    <!-- Mountain Layer (Soft Warm Ochre & Amber in Distance) -->
    <path d="M-50,310 Q120,240 320,270 T700,250 T1050,265 T1250,290 L1250,400 L-50,400 Z" fill="#E8DDB9" opacity="0.5"/>
    <path d="M-50,325 Q180,265 420,295 T880,270 T1250,305 L1250,400 L-50,400 Z" fill="#F8CB78" opacity="0.45"/>

    <!-- Midground Forest Silhouette (Pines & Oaks in Autumn Sunlight) -->
    <g fill="#9A7807" opacity="0.45">
      <!-- Left Ridge -->
      <polygon points="20,340 32,270 44,340"/>
      <polygon points="40,345 55,260 70,345"/>
      <polygon points="65,342 78,280 91,342"/>
      <polygon points="85,348 102,250 120,348"/>
      <polygon points="115,350 130,275 145,350"/>
      <polygon points="140,355 160,265 180,355"/>
      <polygon points="175,352 192,285 210,352"/>
      <polygon points="205,358 225,295 245,358"/>

      <!-- Right Ridge -->
      <polygon points="955,358 975,295 995,358"/>
      <polygon points="990,352 1008,285 1025,352"/>
      <polygon points="1020,355 1040,265 1060,355"/>
      <polygon points="1055,350 1070,275 1085,350"/>
      <polygon points="1080,348 1098,250 1115,348"/>
      <polygon points="1110,342 1122,280 1135,342"/>
      <polygon points="1130,345 1145,260 1160,345"/>
      <polygon points="1155,340 1168,270 1180,340"/>
    </g>

    <!-- Foreground Rolling Hills -->
    <path d="M-20,355 Q200,325 450,348 T950,340 T1220,360 L1220,400 L-20,400 Z" fill="url(#lightGroundGrad)"/>

    <!-- Framing Autumn Branches (Left Side - Earth Brown & Warm Amber) -->
    <g stroke="#40271D" stroke-linecap="round" fill="none">
      <path d="M-20,60 Q70,90 120,160 Q150,210 160,360" stroke-width="13"/>
      <path d="M60,105 Q140,110 190,145" stroke-width="5.5"/>
      <path d="M110,150 Q180,165 230,195" stroke-width="3.5"/>
      <path d="M130,185 Q200,215 220,250" stroke-width="2.5"/>
      <!-- Golden Circuit Traces along Tree Trunk -->
      <path d="M-10,75 Q65,100 115,165 Q140,210 152,360" stroke="#D0A823" stroke-width="1.6" opacity="0.85"/>
      <path d="M62,108 Q135,113 185,147" stroke="#F7D327" stroke-width="1.2" opacity="0.85"/>
      <circle cx="185" cy="147" r="3" fill="#D0A823" stroke="#40271D" stroke-width="0.8"/>
      <circle cx="230" cy="195" r="2.5" fill="#EB7134"/>
      <circle cx="152" cy="270" r="3" fill="#D0A823"/>
    </g>

    <!-- Left Foliage Clusters (Golden, Amber, Burnt Sienna) -->
    <g>
      <ellipse cx="65" cy="85" rx="38" ry="24" fill="#A83A0A" opacity="0.85"/>
      <ellipse cx="120" cy="100" rx="42" ry="26" fill="#D0A823" opacity="0.9"/>
      <ellipse cx="90" cy="70" rx="32" ry="20" fill="#EB7134" opacity="0.85"/>
      <ellipse cx="160" cy="120" rx="35" ry="22" fill="#EBAA32" opacity="0.9"/>
      <ellipse cx="195" cy="145" rx="28" ry="18" fill="#F7D327" opacity="0.92"/>
      <ellipse cx="225" cy="190" rx="26" ry="16" fill="#D0A823" opacity="0.85"/>
      <ellipse cx="135" cy="160" rx="30" ry="18" fill="#EB7134" opacity="0.8"/>
    </g>

    <!-- Framing Autumn Branches (Right Side) -->
    <g stroke="#40271D" stroke-linecap="round" fill="none">
      <path d="M1220,60 Q1130,90 1080,160 Q1050,210 1040,360" stroke-width="13"/>
      <path d="M1140,105 Q1060,110 1010,145" stroke-width="5.5"/>
      <path d="M1090,150 Q1020,165 970,195" stroke-width="3.5"/>
      <path d="M1070,185 Q1000,215 980,250" stroke-width="2.5"/>
      <!-- Golden Circuit Traces along Tree Trunk -->
      <path d="M1210,75 Q1135,100 1085,165 Q1060,210 1048,360" stroke="#D0A823" stroke-width="1.6" opacity="0.85"/>
      <path d="M1138,108 Q1065,113 1015,147" stroke="#F7D327" stroke-width="1.2" opacity="0.85"/>
      <circle cx="1015" cy="147" r="3" fill="#D0A823" stroke="#40271D" stroke-width="0.8"/>
      <circle cx="970" cy="195" r="2.5" fill="#EB7134"/>
      <circle cx="1048" cy="270" r="3" fill="#D0A823"/>
    </g>

    <!-- Right Foliage Clusters -->
    <g>
      <ellipse cx="1135" cy="85" rx="38" ry="24" fill="#A83A0A" opacity="0.85"/>
      <ellipse cx="1080" cy="100" rx="42" ry="26" fill="#D0A823" opacity="0.9"/>
      <ellipse cx="1110" cy="70" rx="32" ry="20" fill="#EB7134" opacity="0.85"/>
      <ellipse cx="1040" cy="120" rx="35" ry="22" fill="#EBAA32" opacity="0.9"/>
      <ellipse cx="1005" cy="145" rx="28" ry="18" fill="#F7D327" opacity="0.92"/>
      <ellipse cx="975" cy="190" rx="26" ry="16" fill="#D0A823" opacity="0.85"/>
      <ellipse cx="1065" cy="160" rx="30" ry="18" fill="#EB7134" opacity="0.8"/>
    </g>

    <!-- ==================== ANIMATED FALLING LEAVES (SMIL) ==================== -->
    <g fill="#D0A823" opacity="0.9">
      <use href="#mapleLeaf" transform="scale(1.2)">
        <animateTransform attributeName="transform" type="translate"
          values="280,-30; 340,160; 310,290; 380,430"
          keyTimes="0; 0.4; 0.75; 1" dur="11s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0; 120; 240; 360" additive="sum" dur="6s" repeatCount="indefinite"/>
      </use>
    </g>

    <g fill="#A83A0A" opacity="0.85">
      <use href="#beechLeaf" transform="scale(1.1)">
        <animateTransform attributeName="transform" type="translate"
          values="180,-20; 150,140; 210,280; 170,420"
          keyTimes="0; 0.35; 0.7; 1" dur="14s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate"
          values="25; 180; 320; 385" additive="sum" dur="7s" repeatCount="indefinite"/>
      </use>
    </g>

    <g fill="#EB7134" opacity="0.9">
      <use href="#mapleLeaf" transform="scale(1.3)">
        <animateTransform attributeName="transform" type="translate"
          values="880,-25; 820,130; 890,260; 840,425"
          keyTimes="0; 0.33; 0.68; 1" dur="12.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0; -140; -280; -360" additive="sum" dur="5.5s" repeatCount="indefinite"/>
      </use>
    </g>

    <g fill="#EBAA32" opacity="0.85">
      <use href="#beechLeaf" transform="scale(1.0)">
        <animateTransform attributeName="transform" type="translate"
          values="520,-30; 570,120; 480,240; 550,420"
          keyTimes="0; 0.38; 0.72; 1" dur="16s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate"
          values="-15; 165; 345; 525" additive="sum" dur="8s" repeatCount="indefinite"/>
      </use>
    </g>

    <g fill="#F7D327" opacity="0.95">
      <use href="#mapleLeaf" transform="scale(0.95)">
        <animateTransform attributeName="transform" type="translate"
          values="720,-20; 670,110; 740,240; 690,420"
          keyTimes="0; 0.3; 0.7; 1" dur="13.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate"
          values="45; 180; 315; 405" additive="sum" dur="6.5s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- Floating Sunlit Embers / Sparkles -->
    <g fill="#D0A823">
      <circle cx="340" cy="180" r="1.8" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="220" r="2.2" opacity="0.7">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="680" cy="170" r="2.0" opacity="0.75">
        <animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="230" r="1.9" opacity="0.65">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ==================== CENTRAL CONTENT & TYPOGRAPHY ==================== -->
    <!-- Light Cream Backdrop Shield for High Contrast Reading -->
    <rect x="220" y="38" width="760" height="310" rx="16"
          fill="#FFFDF5" fill-opacity="0.92"
          stroke="#D0A823" stroke-width="1.2"/>
    <rect x="224" y="42" width="752" height="302" rx="13"
          fill="none" stroke="#E8DDB9" stroke-width="0.8"/>

    <!-- Top Badge / Architectural Tag -->
    <g transform="translate(600, 74)">
      <rect x="-190" y="-14" width="380" height="28" rx="14"
            fill="#FFF6D8" stroke="#D0A823" stroke-width="1"/>
      <path d="M-168,-3 C-164,-7 -160,-2 -158,2 C-161,2 -163,6 -166,5 C-167,1 -171,1 -168,-3 Z" fill="#D0A823"/>
      <text x="0" y="5" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="11.5" font-weight="700" letter-spacing="2.8" fill="#54280D">
        AUTUMN FOREST // RESILIENT SYSTEMS
      </text>
    </g>

    <!-- Main Title: AFNAN PATHAN (Bold High-Contrast Warm Earth Gradient) -->
    <g filter="url(#softGlow)">
      <text x="600" y="152" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="58" font-weight="900" letter-spacing="3"
            fill="url(#warmTitleGrad)">
        AFNAN PATHAN
      </text>
    </g>

    <!-- Core Tagline -->
    <text x="600" y="196" text-anchor="middle"
          font-family="Georgia, Cambria, 'Times New Roman', serif" font-style="italic"
          font-size="20" fill="#40271D" letter-spacing="0.5">
      &#8220;Building reliable systems, one layer at a time.&#8221;
    </text>

    <!-- Technical Disciplines Subhead -->
    <text x="600" y="235" text-anchor="middle"
          font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace"
          font-size="12.5" font-weight="600" letter-spacing="2.5" fill="#504C41">
      SOFTWARE · CLOUD INFRASTRUCTURE · SYSTEMS · AI SYSTEMS
    </text>

    <!-- Decorative Autumn Hairline Rule with Amber Diamond -->
    <g transform="translate(600, 260)">
      <line x1="-220" y1="0" x2="-20" y2="0" stroke="url(#goldenAccent)" stroke-width="1.2" opacity="0.8"/>
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#D0A823"/>
      <line x1="20" y1="0" x2="220" y2="0" stroke="url(#goldenAccent)" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- Technical Identity Banner -->
    <g transform="translate(600, 298)">
      <rect x="-240" y="-15" width="480" height="30" rx="8"
            fill="#FFF6D8" stroke="#E8DDB9" stroke-width="1"/>
      <path d="M-216,-3 C-212,-7 -208,-2 -206,2 C-209,2 -211,6 -214,5 C-215,1 -219,1 -216,-3 Z" fill="#D0A823"/>
      <text x="-190" y="4.5" text-anchor="start"
            font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace"
            font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#54280D">
        COMPUTER SCIENCE <tspan fill="#D0A823">&#8226;</tspan> CLOUD INFRASTRUCTURE <tspan fill="#D0A823">&#8226;</tspan> SYSTEMS
      </text>
    </g>

    <!-- Outer Card Dual Border (Artisan Frame) -->
    <rect x="3" y="3" width="1194" height="394" rx="16" ry="16"
          fill="none" stroke="#D0A823" stroke-width="1.8" stroke-opacity="0.9"/>
    <rect x="7" y="7" width="1186" height="386" rx="13" ry="13"
          fill="none" stroke="#E8DDB9" stroke-width="1" stroke-opacity="0.8"/>

    <!-- Corner Accents -->
    <path d="M14,34 L14,14 L34,14" fill="none" stroke="#D0A823" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="14" cy="14" r="2.5" fill="#EB7134"/>
    <path d="M1186,34 L1186,14 L1166,14" fill="none" stroke="#D0A823" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1186" cy="14" r="2.5" fill="#EB7134"/>
    <path d="M14,366 L14,386 L34,386" fill="none" stroke="#D0A823" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="14" cy="386" r="2.5" fill="#EB7134"/>
    <path d="M1186,366 L1186,386 L1166,386" fill="none" stroke="#D0A823" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1186" cy="386" r="2.5" fill="#EB7134"/>
  </g>
</svg>
