<svg width="100%" height="auto" viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D0A823" stop-opacity="0"/>
      <stop offset="20%" stop-color="#D0A823" stop-opacity="0.3"/>
      <stop offset="42%" stop-color="#EBAA32" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#F7D327" stop-opacity="1"/>
      <stop offset="58%" stop-color="#EB7134" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#A83A0A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A83A0A" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="divCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7D327" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#EBAA32" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EBAA32" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Central Glow Aura -->
  <circle cx="600" cy="20" r="18" fill="url(#divCenterGlow)"/>

  <!-- Left and Right Gradient Dividers -->
  <line x1="50" y1="20" x2="1150" y2="20" stroke="url(#divLineGrad)" stroke-width="1.2"/>
  <line x1="250" y1="20" x2="950" y2="20" stroke="url(#divLineGrad)" stroke-width="0.6"/>

  <!-- Center Botanical Autumn Motif (Branch & Leaves) -->
  <g transform="translate(600, 20)">
    <!-- Branch Spine -->
    <path d="M-65,0 C-35,-4 -15,4 0,0 C15,-4 35,4 65,0" fill="none" stroke="#D0A823" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Left Leaves -->
    <path d="M-42,-2 C-46,-10 -34,-12 -30,-4 C-34,-3 -38,-1 -42,-2 Z" fill="#EBAA32"/>
    <path d="M-22,1 C-25,9 -15,11 -12,3 C-16,2 -19,1 -22,1 Z" fill="#F7D327"/>
    <path d="M-52,0 C-56,6 -48,9 -44,3 C-47,2 -50,1 -52,0 Z" fill="#EB7134"/>

    <!-- Center Signature Leaf -->
    <path d="M0,-11 C4,-6 5,6 0,11 C-5,6 -4,-6 0,-11 Z" fill="#F7D327"/>
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#9A7807" stroke-width="0.6"/>

    <!-- Right Leaves -->
    <path d="M22,-1 C25,-9 15,-11 12,-3 C16,-2 19,-1 22,-1 Z" fill="#F7D327"/>
    <path d="M42,2 C46,10 34,12 30,4 C34,3 38,1 42,2 Z" fill="#EBAA32"/>
    <path d="M52,0 C56,-6 48,-9 44,-3 C47,-2 50,-1 52,0 Z" fill="#EB7134"/>

    <!-- Subtle Golden Embers -->
    <circle cx="-16" cy="-8" r="1.2" fill="#FEED9F">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="8" r="1.2" fill="#FEED9F">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-38" cy="7" r="1" fill="#F7D327">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="-7" r="1" fill="#F7D327">
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
