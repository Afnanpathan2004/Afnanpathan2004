<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2b0a3d"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffe1"/>
      <stop offset="50%" stop-color="#ff0080"/>
      <stop offset="100%" stop-color="#fff200"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- scanline grid -->
  <g opacity="0.12" stroke="#00ffe1" stroke-width="1">
    <g>
      <line x1="0" y1="0" x2="1200" y2="0"/>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="0,320" dur="4s" repeatCount="indefinite"/>
    </g>
    <line x1="0" y1="20" x2="1200" y2="20"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- glitch layers -->
  <g filter="url(#glow)">
    <text x="600" y="150" text-anchor="middle" font-family="Courier New, monospace" font-size="64" font-weight="bold" fill="#ff0080" opacity="0.55">
      AFNANPATHAN2004
      <animate attributeName="x" values="600;606;594;600" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="150" text-anchor="middle" font-family="Courier New, monospace" font-size="64" font-weight="bold" fill="#00ffe1" opacity="0.55">
      AFNANPATHAN2004
      <animate attributeName="x" values="600;594;606;600" dur="2.7s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="150" text-anchor="middle" font-family="Courier New, monospace" font-size="64" font-weight="bold" fill="url(#titleGrad)">
      AFNANPATHAN2004
    </text>
  </g>

  <text x="600" y="200" text-anchor="middle" font-family="Courier New, monospace" font-size="22" fill="#e6e6e6" letter-spacing="4">
    PLATFORM ENGINEER // SRE // AI INFRASTRUCTURE
  </text>

  <g font-family="Courier New, monospace" font-size="20" fill="#00ffe1">
    <text x="600" y="240" text-anchor="middle">
      &gt; SYSTEM_STATUS: ONLINE
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.6s" repeatCount="indefinite"/>
    </text>
    <rect x="742" y="224" width="14" height="22" fill="#00ffe1">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0.7">
    <circle cx="60" cy="40" r="4" fill="#ff0080">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="40" r="4" fill="#00ffe1">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="280" r="4" fill="#fff200">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="280" r="4" fill="#ff0080">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
